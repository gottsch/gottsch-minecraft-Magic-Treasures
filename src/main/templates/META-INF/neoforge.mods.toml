modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}"
license="GNU GPLv3"
issueTrackerURL="https://github.com/gottsch/gottsch-minecraft-Magic-Treasures/issues" #optional

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
updateJSONURL="https://raw.githubusercontent.com/gottsch/gottsch-minecraft-Magic-Treasures/neoforge-1.21.1-main/update.json" #optional
displayURL="https://www.curseforge.com/minecraft/mc-mods/magic-treasures" #optional
logoFile="magic_treasures_curseforge_logo.png" #optional
authors="${mod_authors}" #optional
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# a library this mod depends on loads first, so AFTER (1.20.1 had BEFORE, which is backwards)
[[dependencies.${mod_id}]]
    modId="gottschcore"
    type="required"
    versionRange="${gottschcore_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="treasure2"
    type="optional"
    versionRange="${treasure2_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    type="optional"
    versionRange="${curios_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="configured"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="CLIENT"
